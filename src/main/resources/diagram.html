<!DOCTYPE html>
<html>
<head>
    <script src="mermaid.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            min-height: 42px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            flex: 0 0 42px;
            background: rgba(0, 0, 0, 0.10);
        }

        #header.concept {
            display: none;
        }

        #brand-title {
            font: 600 18px Arial, sans-serif;
            color: white;
        }

        #logo {
            position: absolute;
            right: 10px;
            width: 30px;
            height: 30px;
        }

        #concept-heading {
            flex: 0 0 auto;
            padding: 10px 20px 2px;
            box-sizing: border-box;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        #concept-heading[hidden] {
            display: none;
        }

        #concept-title {
            font-size: 28px;
            line-height: 1.15;
            font-weight: 700;
        }

        #concept-subtitle {
            margin-top: 3px;
            font-size: 18px;
            line-height: 1.25;
            font-weight: 500;
        }

        #diagram {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            padding: 14px 16px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .mermaid {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mermaid svg {
            display: block;
            flex: 0 0 auto;
        }
    </style>
</head>

<body>
    <div id="header">
        <div id="brand-title">Data Structure Advisor</div>
        <img id="logo" src="icon.png" alt="">
    </div>

    <div id="concept-heading" hidden>
        <div id="concept-title"></div>
        <div id="concept-subtitle"></div>
    </div>

    <div id="diagram"></div>

    <script>
        mermaid.initialize({ startOnLoad: false });

        function isLightColor(hex) {
            hex = hex.replace("#", "");
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);

            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 150;
        }

        function calculateContainSize(
            availableWidth,
            availableHeight,
            contentWidth,
            contentHeight
        ) {
            if (availableWidth <= 0 || availableHeight <= 0
                || contentWidth <= 0 || contentHeight <= 0) {
                return { width: 0, height: 0 };
            }
            const scale = Math.min(
                availableWidth / contentWidth,
                availableHeight / contentHeight
            );
            return {
                width: Math.floor(contentWidth * scale),
                height: Math.floor(contentHeight * scale)
            };
        }

        function fitDiagram() {
            const viewport = document.getElementById("diagram");
            const svg = viewport.querySelector(".mermaid svg");
            if (!svg || !svg.viewBox || !svg.viewBox.baseVal) {
                return;
            }

            const viewBox = svg.viewBox.baseVal;
            const styles = window.getComputedStyle(viewport);
            const availableWidth = viewport.clientWidth
                - parseFloat(styles.paddingLeft)
                - parseFloat(styles.paddingRight);
            const availableHeight = viewport.clientHeight
                - parseFloat(styles.paddingTop)
                - parseFloat(styles.paddingBottom);
            const fitted = calculateContainSize(
                availableWidth,
                availableHeight,
                viewBox.width,
                viewBox.height
            );

            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
            svg.style.width = fitted.width + "px";
            svg.style.height = fitted.height + "px";
            svg.style.maxWidth = "100%";
            svg.style.maxHeight = "100%";
        }

        if ("ResizeObserver" in window) {
            const resizeObserver = new ResizeObserver(() =>
                window.requestAnimationFrame(fitDiagram)
            );
            resizeObserver.observe(document.getElementById("diagram"));
        }
        window.addEventListener("resize", fitDiagram);

        window.renderDiagram = function(
            mmdSource,
            bgColor,
            showBranding
        ) {
            document.body.style.backgroundColor = bgColor;

            const header = document.getElementById("header");
            const brandTitle = document.getElementById("brand-title");
            const conceptHeading =
                document.getElementById("concept-heading");
            const conceptTitle =
                document.getElementById("concept-title");
            const conceptSubtitle =
                document.getElementById("concept-subtitle");
            header.classList.toggle("concept", !showBranding);

            if (isLightColor(bgColor)) {
                header.style.background = "rgba(0, 0, 0, 0.10)";
                brandTitle.style.color = "#111111";
                conceptHeading.style.color = "#111111";
            } else {
                header.style.background = "rgba(255, 255, 255, 0.05)";
                brandTitle.style.color = "#ffffff";
                conceptHeading.style.color = "#ffffff";
            }

            const titleMatch =
                mmdSource.match(/^%% @title (.+)$/m);
            const subtitleMatch =
                mmdSource.match(/^%% @subtitle (.+)$/m);
            conceptTitle.textContent =
                titleMatch ? titleMatch[1].trim() : "";
            conceptSubtitle.textContent =
                subtitleMatch ? subtitleMatch[1].trim() : "";
            conceptHeading.hidden = showBranding || !titleMatch;
            mmdSource = mmdSource
                .replace(/^%% @title .+$(\r?\n)?/m, "")
                .replace(/^%% @subtitle .+$(\r?\n)?/m, "");

            const container = document.getElementById("diagram");
            container.innerHTML =
                '<div class="mermaid">' + mmdSource + '</div>';

            mermaid.init(
                undefined,
                container.querySelector(".mermaid"),
                () => window.requestAnimationFrame(fitDiagram)
            );
        };
    </script>
</body>
</html>
